# Lo que comparten el servidor HTTP y el HTTPS (default.conf y default.tls.conf lo incluyen):
# cabeceras de seguridad, la SPA y el proxy hacia el backend.

root /usr/share/nginx/html;
index index.html;

client_max_body_size 6m;   # el import XMI admite hasta 5 MB

# Cabeceras de seguridad. Ojo: un `add_header` dentro de un `location` sustituye a estas, no se suma; por eso
# los `location` de abajo usan `expires` (que no es un `add_header`) para el caché.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# El micrófono lo usa el dictado por voz del asistente; cámara y ubicación no hacen falta.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

# Comprobación de salud para Docker y para el balanceador.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Nadie tiene por qué pedir .env, .git… (sí se deja pasar /.well-known, que usa Let's Encrypt).
location ~ /\.(?!well-known) {
    deny all;
}

# Los archivos de /assets llevan un hash en el nombre: nunca cambian, así que se guardan un año.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# El punto de entrada y el service worker de las notificaciones NO se guardan: si no, un despliegue nuevo no
# llegaría a los usuarios hasta que caducara la copia.
location = /index.html {
    expires -1;
}
location = /firebase-messaging-sw.js {
    expires -1;
}

# SPA de React: cualquier ruta desconocida cae en index.html.
location / {
    try_files $uri $uri/ /index.html;
}

# La dirección del backend va en una variable para que Nginx la vuelva a resolver con `resolver` (ver
# default.conf). Con un nombre fijo la resolvería una sola vez al arrancar, y si el backend se reinicia con otra
# IP todo respondería 502 hasta reiniciar también Nginx.
location /api/ {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /graphql {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Una instrucción al asistente puede tardar hasta AI_TIMEOUT_SECONDS.
    proxy_read_timeout 90s;
}

# WebSocket/STOMP: requiere el upgrade de protocolo y no debe expirar por inactividad.
location /ws {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# El ai-service NO se proxifica: es un servicio interno.
