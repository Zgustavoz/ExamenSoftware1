# Servidor HTTP (puerto 80). Para HTTPS ver infra/nginx/default.tls.conf.template.

# DNS interno de Docker; la respuesta se guarda 10 s para volver a resolver `backend` si se reinicia.
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/app.conf;
}
